<aside class="sidebar" [class.sidebar--open]="open()" [class.sidebar--closed]="!open()">
  <div class="sidebar__header">
    <p class="sidebar__title">
      <span aria-hidden="true">{{ book().icon }}</span>
      {{ book().title }}
    </p>
    <button
      type="button"
      class="sidebar__close"
      aria-label="Close navigation menu"
      (click)="closeRequested.emit()"
    >
      ✕
    </button>
  </div>

  <nav class="sidebar__links" aria-label="{{ book().title }} navigation">
    @for (link of book().links; track link.path) {
      <a
        class="sidebar__link"
        [routerLink]="link.path"
        routerLinkActive="sidebar__link--active"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    <a class="sidebar__link" routerLink="/contact">Contact</a>
  </div>
</aside>
